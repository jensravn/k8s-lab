apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sudoku
spec:
  # A second app on the same Gateway: another route, another listener pair.
  # No second load balancer, no second address, no DNS work beyond one record.
  parentRefs:
    - name: web
      sectionName: sudoku-https
  hostnames:
    - sudoku.jravn.com
  rules:
    - backendRefs:
        - name: sudoku
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sudoku-redirect
spec:
  parentRefs:
    - name: web
      sectionName: sudoku-http
  hostnames:
    - sudoku.jravn.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
