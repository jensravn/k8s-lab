apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  annotations:
    # cert-manager watches this and keeps the secret named under the HTTPS
    # listener filled, renewing about 30 days before expiry.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  listeners:
    # Kept alongside HTTPS for two reasons: it redirects to HTTPS, and
    # Let's Encrypt fetches its HTTP-01 challenge token over plain HTTP.
    - name: http
      protocol: HTTP
      port: 80
      hostname: jravn.com
      # The Gateway lives in the same namespace as the app, so routes from
      # elsewhere would need a ReferenceGrant to attach. One app, one
      # namespace: nothing to grant.
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: jravn.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: web-tls
      allowedRoutes:
        namespaces:
          from: Same
    # A second hostname is a second pair of listeners on the same Gateway,
    # sharing its address and its load balancer. cert-manager fills a
    # certificate secret per listener from the annotation above.
    - name: sudoku-http
      protocol: HTTP
      port: 80
      hostname: sudoku.jravn.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: sudoku-https
      protocol: HTTPS
      port: 443
      hostname: sudoku.jravn.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: sudoku-tls
      allowedRoutes:
        namespaces:
          from: Same
