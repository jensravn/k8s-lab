apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jensravn102@pm.me
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # HTTP-01 proves control of the hostname by serving a token over the
      # Gateway. No DNS provider credentials needed, but it cannot issue
      # wildcard certificates — that would require DNS-01.
      #
      # cert-manager attaches a short-lived HTTPRoute to the Gateway named
      # here for the duration of each challenge. Its exact path match beats
      # the catch-all redirect on the HTTP listener, so the token is reachable
      # over plain HTTP, which is all ACME will use.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: web
                namespace: default
                kind: Gateway
